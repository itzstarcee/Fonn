<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fends | Tu mundo en video</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        
        body { background-color: #000; color: white; overflow: hidden; }

        /* Contenedor principal de videos (Snap Scroll) */
        .app-container {
            height: 100vh;
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
        }

        .video-card {
            height: 100vh;
            width: 100%;
            scroll-snap-align: start;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #121212;
        }

        /* Video de fondo */
        .video-player {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* Interfaz sobre el video */
        .overlay {
            position: absolute;
            bottom: 80px;
            left: 0;
            width: 100%;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }

        .video-info h3 { margin-bottom: 8px; font-size: 1.2rem; }
        .video-info p { font-size: 0.9rem; opacity: 0.9; }

        /* Barra lateral de acciones */
        .side-bar {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            margin-bottom: 20px;
        }

        .action-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            text-align: center;
            transition: transform 0.2s;
        }

        .action-btn:active { transform: scale(0.9); }
        .action-btn i { font-size: 28px; display: block; }
        .action-btn span { font-size: 12px; margin-top: 5px; display: block; }

        .profile-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid white;
            margin-bottom: 10px;
        }

        /* Navegación inferior */
        .nav-bottom {
            position: fixed;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: black;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 0.5px solid #333;
        }

        .nav-item { color: #888; text-decoration: none; font-size: 20px; }
        .nav-item.active { color: white; }
        .upload-btn {
            background: white;
            color: black;
            padding: 5px 15px;
            border-radius: 8px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        
        <section class="video-card">
            <video class="video-player" loop onclick="this.paused ? this.play() : this.pause()">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-girl-in-neon-light-1282-large.mp4" type="video/mp4">
            </video>

            <div class="overlay">
                <div class="video-info">
                    <h3>@usuario_fends</h3>
                    <p>Disfrutando del estilo moderno de mi nueva red social #Fends 🚀</p>
                </div>

                <div class="side-bar">
                    <img src="https://i.pravatar.cc/150?u=1" class="profile-pic" alt="Avatar">
                    <button class="action-btn" onclick="toggleLike(this)">
                        <i class="fas fa-heart"></i>
                        <span>1.2k</span>
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-comment-dots"></i>
                        <span>85</span>
                    </button>
                    <button class="action-btn">
                        <i class="fas fa-bookmark"></i>
                        <span>24</span>
                    </button>
                </div>
            </div>
        </section>

        <section class="video-card">
            <video class="video-player" loop onclick="this.paused ? this.play() : this.pause()">
                <source src="https://assets.mixkit.co/videos/preview/mixkit-tree-with-yellow-leaves-low-angle-shot-1571-large.mp4" type="video/mp4">
            </video>
            <div class="overlay">
                <div class="video-info">
                    <h3>@creador_fends</h3>
                    <p>Diseño simple pero elegante. #Minimalismo #Fends</p>
                </div>
                <div class="side-bar">
                    <img src="https://i.pravatar.cc/150?u=2" class="profile-pic">
                    <button class="action-btn"><i class="fas fa-heart"></i><span>500</span></button>
                    <button class="action-btn"><i class="fas fa-comment-dots"></i><span>12</span></button>
                    <button class="action-btn"><i class="fas fa-bookmark"></i><span>5</span></button>
                </div>
            </div>
        </section>

    </div>

    <nav class="nav-bottom">
        <a href="#" class="nav-item active"><i class="fas fa-home"></i></a>
        <a href="#" class="nav-item"><i class="fas fa-search"></i></a>
        <a href="#" class="nav-item upload-btn"><i class="fas fa-plus"></i></a>
        <a href="#" class="nav-item"><i class="fas fa-heart"></i></a>
        <a href="#" class="nav-item"><i class="fas fa-user"></i></a>
    </nav>

    <script>
        // Función simple para el Like (Visual)
        function toggleLike(btn) {
            const icon = btn.querySelector('i');
            icon.style.color = icon.style.color === 'red' ? 'white' : 'red';
            // Aquí iría tu conexión a la DB más tarde
        }
    </script>
</body>
</html>
