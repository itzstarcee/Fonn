<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FONN 2.1 | Discord Style</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --discord-gray: #36393f;
            --discord-dark: #2f3136;
            --discord-text: #dcddde;
            --discord-input: #40444b;
            --discord-green: #43b581;
            --discord-blurple: #5865f2;
        }

        body { 
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; 
            background: var(--discord-gray); 
            color: var(--discord-text); 
            margin: 0; 
            display: flex; 
            flex-direction: column; 
            height: 100vh; 
        }

        /* Encabezado simple */
        #header { 
            height: 48px; 
            padding: 0 16px; 
            display: flex; 
            align-items: center; 
            background: var(--discord-gray);
            border-bottom: 1px solid #262729; 
            font-weight: bold; 
            box-shadow: 0 1px 2px rgba(0,0,0,0.1); 
        }

        /* Area de mensajes */
        #messages { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px 0; 
        }

        .message-group { 
            padding: 5px 20px; 
            display: flex; 
            align-items: flex-start; 
        }

        .message-group:hover { 
            background: rgba(4, 4, 5, 0.07); 
        }

        .avatar { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            margin-right: 16px; 
            background: var(--discord-blurple); 
            flex-shrink: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            color: white; 
        }

        .ai-avatar { 
            background: var(--discord-green); 
        }

        .msg-content { 
            display: flex; 
            flex-direction: column; 
        }

        .author { 
            font-weight: 500; 
            color: white; 
            display: flex; 
            align-items: center; 
        }

        .author .time { 
            font-size: 12px; 
            color: #72767d; 
            margin-left: 8px; 
            font-weight: 400; 
        }

        .text { 
            font-size: 15px; 
            margin-top: 4px; 
            color: #dcddde; 
        }

        /* Caja de entrada */
        #input-container { 
            padding: 0 20px 24px 20px; 
            background: var(--discord-gray);
        }

        #input-wrapper { 
            background: var(--discord-input); 
            border-radius: 8px; 
            display: flex; 
            align-items: center; 
            padding: 0 16px; 
            height: 44px; 
        }

        input { 
            background: transparent; 
            border: none; 
            color: white; 
            flex: 1; 
            font-size: 15px; 
            outline: none; 
        }

        input::placeholder { 
            color: #72767d; 
        }
    </style>
</head>
<body>

    <div id="header"># fonn-2.1-ia</div>
    
    <div id="messages">
        </div>

    <div id="input-container">
        <div id="input-wrapper">
            <input type="text" id="userInput" placeholder="Enviar mensaje a #fonn-2.1-ia" onkeypress="checkEnter(event)">
        </div>
    </div>

<script>
    const SUPABASE_URL = 'https://uhtxgxedkufnxkmbufvy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__aNQp_aBHJ6MMGYA2AIwXA_ApjnWs5j';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function checkEnter(e) {
        if (e.key === 'Enter') handleChat();
    }

    async function handleChat() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'Tú', false);
        input.value = "";

        if (text.includes('=')) {
            const [entrada, respuesta] = text.split('=').map(t => t.trim());
            const { error } = await _supabase.from('memoria').insert([{ entrada, respuesta }]);
            addMessage(error ? "Error" : `Aprendido: **${entrada}**`, 'FONN 2.1', true);
        } 
        else if (text.startsWith('-')) {
            const borrar = text.substring(1).trim();
            const { error } = await _supabase.from('memoria').delete().eq('entrada', borrar);
            addMessage(error ? "Error" : `Borrado: **${borrar}**`, 'FONN 2.1', true);
        } 
        else {
            const { data } = await _supabase.from('memoria').select('respuesta').eq('entrada', text);
            if (data && data.length > 0) {
                addMessage(data[0].respuesta, 'FONN 2.1', true);
            } else {
                addMessage(`No sé eso aún. Enséñame: \`${text} = tu respuesta\``, 'FONN 2.1', true);
            }
        }
    }

    function addMessage(txt, author, isAI) {
        const container = document.getElementById('messages');
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        
        const html = `
            <div class="message-group">
                <div class="avatar ${isAI ? 'ai-avatar' : ''}">${author.charAt(0)}</div>
                <div class="msg-content">
                    <div class="author">${author} <span class="time">${now}</span></div>
                    <div class="text">${txt}</div>
                </div>
            </div>`;
        
        container.innerHTML += html;
        container.scrollTop = container.scrollHeight;
    }
</script>
</body>
</html>
