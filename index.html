<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FONN 2.1 - Panel de IA</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #121212; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        #chat-container { 
            width: 400px; 
            height: 600px; 
            background: #1e1e1e; 
            border-radius: 15px; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border: 1px solid #333;
        }
        #header { 
            padding: 20px; 
            background: #333; 
            text-align: center; 
            border-bottom: 2px solid #00ff88; 
        }
        #messages { 
            flex: 1; 
            padding: 20px; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 12px; 
        }
        .msg { 
            padding: 10px 15px; 
            border-radius: 12px; 
            max-width: 80%; 
            font-size: 14px;
            line-height: 1.4;
        }
        .user { 
            background: #007bff; 
            align-self: flex-end; 
            border-bottom-right-radius: 2px;
        }
        .ai { 
            background: #444; 
            align-self: flex-start; 
            border-bottom-left-radius: 2px;
            border-left: 4px solid #00ff88; 
        }
        #input-area { 
            display: flex; 
            padding: 15px; 
            background: #252525; 
        }
        input { 
            flex: 1; 
            padding: 12px; 
            border: none; 
            border-radius: 8px; 
            background: #333; 
            color: white; 
            outline: none; 
        }
        button { 
            margin-left: 10px; 
            padding: 10px 18px; 
            border: none; 
            border-radius: 8px; 
            background: #00ff88; 
            color: #121212; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { background: #00cc6e; }
    </style>
</head>
<body>

<div id="chat-container">
    <div id="header">
        <strong>FONN 2.1</strong><br><small style="color: #888;">Sistema de Aprendizaje Activo</small>
    </div>
    <div id="messages">
        <div class="msg ai">¡Hola! Soy FONN 2.1.<br><br>• <b>Enseñar:</b> Hola = Qué tal<br>• <b>Borrar:</b> -Hola</div>
    </div>
    <div id="input-area">
        <input type="text" id="userInput" placeholder="Escribe algo..." onkeypress="if(event.key==='Enter') handleChat()">
        <button onclick="handleChat()">Enviar</button>
    </div>
</div>

<script>
    // Tu conexión real a Supabase
    const SUPABASE_URL = 'https://uhtxgxedkufnxkmbufvy.supabase.co';
    const SUPABASE_KEY = 'sb_publishable__aNQp_aBHJ6MMGYA2AIwXA_ApjnWs5j';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function handleChat() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMessage(text, 'user');
        input.value = "";

        if (text.includes('=')) {
            // Lógica para ENSEÑAR
            const [entrada, respuesta] = text.split('=').map(t => t.trim());
            const { error } = await _supabase.from('memoria').insert([{ entrada, respuesta }]);
            addMessage(error ? "Hubo un error al guardar." : `¡Entendido! Ahora cuando digas "<b>${entrada}</b>", responderé "<b>${respuesta}</b>".`, 'ai');
        } 
        else if (text.startsWith('-')) {
            // Lógica para BORRAR
            const palabraABorrar = text.substring(1).trim();
            const { error } = await _supabase.from('memoria').delete().eq('entrada', palabraABorrar);
            addMessage(error ? "No pude borrarlo." : `He borrado "<b>${palabraABorrar}</b>" de mi memoria.`, 'ai');
        } 
        else {
            // Lógica para RESPONDER
            const { data } = await _supabase.from('memoria').select('respuesta').eq('entrada', text);
            if (data && data.length > 0) {
                addMessage(data[0].respuesta, 'ai');
            } else {
                addMessage(`Aún no sé qué responder a eso. Enséñame usando el símbolo "="`, 'ai');
            }
        }
    }

    function addMessage(txt, side) {
        const messagesDiv = document.getElementById('messages');
        messagesDiv.innerHTML += `<div class="msg ${side}">${txt}</div>`;
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }
</script>

</body>
</html>
